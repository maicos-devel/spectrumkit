name: Tests dev

on:
  schedule:
    # check once a week on mondays
    - cron: '0 10 * * 1'

jobs:
  tests-dev:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tests dependencies
        run: python -m pip install tox

      - name: Run tests against MAICoS dev version
        run: tox -e tests-dev

  tests-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # v0.1.0 predates tests/requirements.txt, so install them before the checkout
      - name: Install released spectrumkit and test dependencies
        run: |
          python -m pip install spectrumkit
          python -m pip install -r tests/requirements.txt
          python -m pip list

      - name: Check out latest release tag
        run: git checkout $(git describe --tags --abbrev=0)

      - name: Run tests against released versions
        run: pytest
